name: Clonify CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.13.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded
      - name: Compile CLI
        run: dart compile exe bin/clonify.dart -o clonify-check.exe
      - name: Smoke test compiled CLI
        run: ./clonify-check.exe --help
